    <main >
        <section class="contact-section">
                <h2 class="title">Get in Touch</h2>
                <div class="text">
                    <p>I'd like to hear from you! If you have any questions, comments, or feedback, please use the form below.</p>
                </div>
                <form name="contact-form" action="/submit" method="post">
                    <div class="form">
                        <div class="name-email">
                            <div class="input">
                                <label for="name">Name</label>
                                <input name="name" type="text" id="name" placeholder="Enter your name" required> 
                                
                            </div>
                            <div class="input">
                                <label for="email">Email</label>
                                <input name="email" type="email" id="email" placeholder="Enter your Email" required>
                                
                            </div>
                        </div>
                        <div class="message">
                            <label for="message">Message</label>
                            <textarea name="message" id="message" placeholder="Enter your message" rows="5" required></textarea>
                        </div>
                        <button type="submit">Send Message</button>
                    </div>
                </form>
        </section>
    </main>
    
    <footer>
